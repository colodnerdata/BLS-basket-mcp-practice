[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "bls_escalation_mcp"
version = "0.1.0"
description = "FastMCP server for constructing transparent custom cost escalation indexes from BLS data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0,<3.3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.0,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.11,<1",
    "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bls_escalation_mcp"]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
test = "pytest"
typecheck = "mypy src"
check = ["lint", "format-check", "typecheck", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

